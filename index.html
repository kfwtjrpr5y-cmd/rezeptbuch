<style>
/* Layout: sticky header + left filter rail (desktop) / bottom sheet (phone), photo-forward card grid, full-screen recipe sheet */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --sunk:#eceee6; --ink:#1f241b; --muted:#646b5c; --line:#d9ddd0;
  --accent:#3f6a35; --accent-ink:#ffffff; --accent-soft:#e2ecd9;
  --plum:#7a2e4f; --plum-soft:#f3e3ea; --warn:#9a5b10;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,30,10,.06),0 6px 20px rgba(20,30,10,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141712; --surface:#1d211a; --sunk:#252a21; --ink:#e9ecE3; --muted:#a1a897; --line:#343a2e;
  --accent:#8fbf7a; --accent-ink:#13200e; --accent-soft:#2a3a23; --plum:#e39bbb; --plum-soft:#3a2430; --warn:#e2a95b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141712; --surface:#1d211a; --sunk:#252a21; --ink:#e9ece3; --muted:#a1a897; --line:#343a2e;
  --accent:#8fbf7a; --accent-ink:#13200e; --accent-soft:#2a3a23; --plum:#e39bbb; --plum-soft:#3a2430; --warn:#e2a95b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:12px;align-items:center;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{font-size:1.45rem;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.8rem}
.search{flex:1 1 280px;position:relative;order:3;min-width:0}
@media (min-width:760px){.search{order:0;max-width:440px}}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--plum);border-color:var(--plum)}
.btn.ghost{border-color:transparent;background:transparent}
.btn .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-size:.75rem}
#filterBtn{display:inline-flex}
@media (min-width:960px){
  body.norail main.wrap{grid-template-columns:minmax(0,1fr)}
  body.norail aside.rail{display:none}
  body.norail .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  #filterBtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  aside.rail{position:sticky}
  .railgrip{position:absolute;top:0;right:-14px;width:14px;height:100%;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
  .railgrip::after{content:"";width:4px;height:44px;border-radius:4px;background:var(--line);transition:background .15s,height .15s}
  .railgrip:hover::after,.railgrip.drag::after{background:var(--accent);height:64px}
  aside.rail.dragging{transition:none;pointer-events:none}
  .railtab{display:none}
  body.norail .railtab{display:block;position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:15;width:14px;height:72px;border:0;border-radius:0 10px 10px 0;background:var(--accent-soft);cursor:ew-resize;touch-action:none;padding:0}
  body.norail .railtab:hover{background:var(--nude);width:18px}
}
#filterBtn{min-width:40px;justify-content:center}
#filterBtn .bi.funnel{display:none}
@media (max-width:959px){#filterBtn .bi.side{display:none}#filterBtn .bi.funnel{display:block}}

/* main layout */
main.wrap{display:grid;grid-template-columns:1fr;gap:24px;padding-block:20px 60px}
@media (min-width:960px){main.wrap{grid-template-columns:260px 1fr}}
aside.rail{display:none}
@media (min-width:960px){aside.rail{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}}
.fgroup{border-bottom:1px solid var(--line);padding-block:12px}
.fgroup:first-child{padding-top:0}
.fgroup h3{font-family:var(--f-body);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.fgroup h3 button{border:0;background:none;color:var(--accent);font-size:.72rem;text-transform:none;letter-spacing:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}
.chip .c{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.chip:disabled{opacity:.4;cursor:default}
.more{border:0;background:none;color:var(--accent);font-size:.82rem;padding:4px 2px;font-weight:600}
.ingsearch{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px;font-size:.88rem}

/* results bar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .count{font-weight:700;font-family:var(--f-display);font-size:1.1rem;margin-right:6px}
.bar .active{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.bar .active .chip{background:var(--accent-soft);border-color:transparent}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.85rem}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;border:0;padding:0;text-align:left;min-width:0}
.card:hover .ph img{transform:scale(1.03)}
.ph{aspect-ratio:4/3;background:var(--sunk);overflow:hidden;position:relative;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-size:2rem;opacity:.5}
.ph .fav{position:absolute;top:8px;right:8px;background:var(--surface);border-radius:999px;width:28px;height:28px;display:grid;place-items:center;color:var(--plum);font-size:15px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h2{font-size:1rem;font-weight:700;letter-spacing:-.005em}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.veg{background:var(--accent-soft);color:var(--accent)}
.tag.meat{background:var(--plum-soft);color:var(--plum)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.3rem;margin-bottom:6px}

/* sheet (filters on phone) */
.scrim{position:fixed;inset:0;background:rgba(10,14,8,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:41;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:-16px;background:var(--bg);padding-block:8px;z-index:1}

/* recipe view */
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view .vbar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.view .vbar .wrap{display:flex;gap:8px;align-items:center;padding-block:10px}
.view .vbar .sp{flex:1}
.vhero{display:grid;grid-template-columns:1fr;gap:20px;padding-block:20px}
@media (min-width:860px){.vhero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.vhero .big{border-radius:16px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.vhero .big img{width:100%;height:100%;object-fit:cover;display:block}
.vhead{display:flex;flex-direction:column;gap:12px;min-width:0}
.vhead h2{font-size:clamp(1.6rem,3.6vw,2.4rem);letter-spacing:-.015em}
.vhead .sub{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:8px 12px}
.facts b{display:block;font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.facts span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.nutri{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nutri strong{color:var(--ink)}
.vcols{display:grid;grid-template-columns:1fr;gap:28px;padding-bottom:48px}
@media (min-width:860px){.vcols{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}}
.vcols h3{font-size:1.15rem;margin-bottom:10px}
.ing{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);align-self:start}
.ing h4{margin:12px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.ing ul{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ing li:last-child{border-bottom:0}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ing .note{color:var(--muted);font-size:.85em}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px;max-width:68ch}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:10px}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.85rem}
.usebox{margin:28px 0 8px;background:var(--surface);border-radius:20px;padding:20px 24px 22px;box-shadow:var(--shadow)}.usebox>h3{margin:0 0 6px;font-size:1.45rem;display:flex;gap:10px;align-items:center}.usebox>h3 svg{width:26px;height:26px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.7}.usebox .ufam{margin:0 0 14px;color:var(--muted);font-size:.92rem}.usebox .ug{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 28px}.usebox h5{margin:0 0 4px;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}.usebox .ug p{margin:0;line-height:1.5}.usebox .uchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.usebox .usec{margin-top:18px}.usebox .relg{margin-top:8px}.usebox .ucombo{margin:0 0 12px;max-width:80ch;line-height:1.5}.glink{margin-left:8px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 9px;font:600 .72rem/1.5 inherit;cursor:pointer;vertical-align:middle;letter-spacing:0;text-transform:none}.glink:hover{filter:brightness(.96)}
.tipbox{margin-top:20px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;max-width:68ch;white-space:pre-wrap}
.src{margin-top:14px;font-size:.82rem;color:var(--muted)}
.src a{color:var(--accent)}

/* editor */
form.ed{display:grid;gap:14px;padding-block:20px 60px;max-width:900px}
.ed label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.85rem;min-width:0}
.ed label small{font-weight:400;color:var(--muted)}
.ed input,.ed textarea,.ed select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:400;font-size:.95rem;width:100%}
.ed textarea{resize:vertical;min-height:90px;line-height:1.45}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.edphoto{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.edphoto .thumb{width:140px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--sunk)}
.edphoto .thumb img{width:100%;height:100%;object-fit:cover}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:500;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px}
.checks input{width:auto}
.confirm{background:var(--plum-soft);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.ro{font-size:.8rem;color:var(--muted)}

/* ---- Pink-Nude: Playfair Display für Titel, Lato für Text ---- */
:root{--bg:#fbf6f3;--surface:#ffffff;--sunk:#f5eae5;--ink:#3d2c2b;--muted:#8d7571;--line:#eedfd8;--accent:#a8645f;--accent-ink:#ffffff;--accent-soft:#f6e2dc;--nude:#eccfc6;--nude-ink:#7d4642;--plum:#9a4a5f;--plum-soft:#f7e4e9;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;--f-body:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--shadow:0 1px 2px rgba(120,70,60,.05),0 8px 24px rgba(120,70,60,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1717;--surface:#271f1f;--sunk:#322827;--ink:#f5eae7;--muted:#bba49f;--line:#3e3231;--accent:#e4aaa2;--accent-ink:#2b1715;--accent-soft:#3f2b29;--nude:#5a3e3a;--nude-ink:#f6d8d0;--plum:#f0a4b8;--plum-soft:#3f2531;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1717;--surface:#271f1f;--sunk:#322827;--ink:#f5eae7;--muted:#bba49f;--line:#3e3231;--accent:#e4aaa2;--accent-ink:#2b1715;--accent-soft:#3f2b29;--nude:#5a3e3a;--nude-ink:#f6d8d0;--plum:#f0a4b8;--plum-soft:#3f2531;--shadow:none;color-scheme:dark}
body{font-size:16px;letter-spacing:.005em}
h1,h2,h3{letter-spacing:0;font-weight:600}
.brand h1{font-size:2rem;font-weight:600}
.brand h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.brand{justify-content:center;align-self:center}
.brand h1{line-height:1;padding-bottom:.08em}
.brand small{display:none!important}
.top .wrap{align-items:center}
header.top{border-bottom-color:transparent;background:color-mix(in srgb,var(--bg) 88%,transparent)}
.search input{background:var(--sunk);border-color:transparent;border-radius:12px}
.btn{border-radius:999px;border-color:transparent;background:var(--sunk);font-weight:700;letter-spacing:.01em}
.btn.primary{background:var(--accent)}
aside.rail .chips{flex-direction:column;gap:1px;flex-wrap:nowrap}
aside.rail .chip,.sheet .chip{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:.95rem;justify-content:space-between;width:100%;text-align:left}
.sheet .chips{flex-direction:column;gap:1px;flex-wrap:nowrap}
aside.rail .chip:hover{background:var(--sunk)}
aside.rail .chip[aria-pressed="true"],.sheet .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
aside.rail .chip[aria-pressed="true"] .c,.sheet .chip[aria-pressed="true"] .c{color:var(--accent);opacity:1}
.fgroup{border-bottom:0;padding-block:10px}
.fgroup h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-inline:10px}
.ingsearch{background:var(--sunk);border-color:transparent;border-radius:8px}
.bar .active .chip{background:var(--accent-soft);color:var(--accent);border:0}
.bar select{background:var(--sunk);border-color:transparent;border-radius:10px}
.grid{gap:22px 16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px}}
.card{background:none;box-shadow:none;border-radius:0;overflow:visible}
.ph{aspect-ratio:1;border-radius:18px;box-shadow:var(--shadow)}
.card .body{padding:9px 2px 0;gap:3px}
.card h2{font-family:var(--f-display);font-size:1.08rem;font-weight:600;line-height:1.25}
.card .tags{display:none}
.meta{font-size:.82rem}
.vhero .big{border-radius:18px}
.vhead h2{font-weight:600}
.facts{border:0;background:none;gap:8px}
.facts div{background:var(--sunk);border-radius:12px}
.ing{box-shadow:none;background:var(--sunk);border-radius:20px;padding:18px 20px}
.ing li{border-bottom-color:var(--line);border-bottom-style:solid}
ol.steps li::before{border-radius:999px;background:var(--nude);color:var(--nude-ink);width:1.9rem;height:1.9rem;font-size:.95rem}
.tipbox{border-radius:14px}
.tag{border-radius:999px}
.tag.veg{background:var(--accent-soft);color:var(--accent)}
.ed input,.ed textarea,.ed select{background:var(--sunk);border-color:transparent;border-radius:10px}
.checks label{background:var(--sunk);border-color:transparent;border-radius:999px}
.tipbox{background:var(--accent-soft)}
.vcols h3{font-size:1.35rem}
.ing h4{color:var(--accent)}
.cnum{font-family:var(--f-display);font-style:italic}
.cstep{font-family:var(--f-display);font-weight:500}
.dup{background:var(--plum-soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dup b{font-family:var(--f-display);font-weight:600}
.dup .acts{display:flex;gap:8px;flex-wrap:wrap}
.dup.flash{outline:2px solid var(--plum)}
.simnote{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:12px;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.simnote button{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
/* Herz & Kochtopf auf dem Bild */
.card{cursor:pointer}
.ph .fav{display:none}

const CAT_ORDER=["mealTypes","dishTypes","collection","diet","suits","season","kind","equip","section","source","mainIngredients"];
function catIndex(){const idx=new Map();
  for(const key of CAT_ORDER){const g=GROUPS.find(x=>x.key===key);if(!g)continue;
    const vals=g.fixed?Object.entries(g.fixed).map(([k,v])=>[k,v.label]):[...new Set(recipes.flatMap(r=>valuesOf(r,key)))].map(v=>[v,v]);
    for(const [v,label] of vals){const n=norm(label).trim();if(n.length>1&&!idx.has(n))idx.set(n,{g:key,v})}
    if(key==="kind"){idx.set("komponente",{g:"kind",v:"component"});idx.set("grundrezept",{g:"kind",v:"component"})}}
  return idx}
function searchToChips(text){
  const idx=catIndex();const words=text.trim().split(/\s+/).filter(Boolean);const rest=[];let hit=false;
  for(let i=0;i<words.length;){let found=null,len=0;
    for(let j=Math.min(words.length,i+4);j>i;j--){const ph=norm(words.slice(i,j).join(" "));if(idx.has(ph)){found=idx.get(ph);len=j-i;break}}
    if(found){state.f[found.g].add(found.v);hit=true;i+=len}else{rest.push(words[i]);i++}}
  return hit?rest.join(" "):null}

function dice(a,b){if(a===b)return 1;const A=bigr(a),B=bigr(b);let c=0;for(const x of A)if(B.has(x))c++;return 2*c/(A.size+B.size||1)}
function titleSim(A,B){if(!A.length||!B.length)return 0;let s=0;for(const a of A)s+=Math.max(...B.map(b=>dice(a,b)));for(const b of B)s+=Math.max(...A.map(a=>dice(a,b)));return s/(A.length+B.length)}
const BASICS=new Set("salz pfeffer butter wasser zucker mehl olivenol oel ol essig rahm milch bouillon".split(" "));
function ingSet(r){return new Set((r.ingredients||[]).flatMap(g=>(g.items||[]).map(i=>norm(String(i.name||"").split(/\s+/).pop()).replace(/[^a-z]/g,""))).filter(w=>w.length>2&&!BASICS.has(w)))}

function similarity(a,b){
  if(a.t&&a.t===b.t)return 1;
  const ts=titleSim(a.tt,b.tt);
  if(a.is.size>=3&&b.is.size>=3){let c=0;for(const x of a.is)if(b.is.has(x))c++;const js=c/(a.is.size+b.is.size-c);
    return Math.max(.6*ts+.4*js,js>=.85&&ts>=.3?js:0)}
  return .9*ts;
}

  dupMap={};const groups={};
  for(const r of recipes){const k=exactKey(r);if(!flat(r.title))continue;(groups[k]=groups[k]||[]).push(r.id)}
  for(const ids of Object.values(groups))if(ids.length>1)for(const a of ids)dupMap[a]=ids.filter(b=>b!==a&&!notDup.has(pairKey(a,b))).map(id=>({id,s:1}));

function flavorItems(c,kind){const L=wLang==="de"?"":"_"+wLang;const pick=f=>{const a=c[f+L]||c[f]||[];const en=c[f+"_en"]||[];const nv=new Set([...(c[f+"_nonveg_en"]||[])]);return a.filter((x,i)=>!nv.has(en[i]))};

function sunburst(fw,kind,only){const cu=fw.flavor.cuisines;const ids=CUIS.map(c=>c[0]).filter(id=>cu[id]&&(!only||only.includes(id)));
  const items=[];for(const id of ids){const c=CUIS.find(x=>x[0]===id);for(const it of flavorItems(cu[id],kind))items.push({id,g:c[4],t:it})}
  if(!items.length)return "";const N=items.length,S=800,cx=S/2,cy=S/2,R0=only?70:80,R1=only?0:130,R2=only?150:200,R3=390;const A=i=>i/N*Math.PI*2-Math.PI/2;
  const arc=(a0,a1,r0,r1)=>{const L=a1-a0>Math.PI?1:0;const p=(a,r)=>`${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;return `M${p(a0,r1)} A${r1} ${r1} 0 ${L} 1 ${p(a1,r1)} L${p(a1,r0)} A${r0} ${r0} 0 ${L} 0 ${p(a0,r0)}Z`};
  const lab=(a,r,txt,size,anchorOut)=>{let deg=a*180/Math.PI;const flip=Math.cos(a)<0;if(flip)deg+=180;return `<text x="${(cx+r*Math.cos(a)).toFixed(1)}" y="${(cy+r*Math.sin(a)).toFixed(1)}" transform="rotate(${deg.toFixed(1)} ${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)})" text-anchor="${flip?(anchorOut?"end":"start"):(anchorOut?"start":"end")}" dominant-baseline="middle" font-size="${size}">${esc(txt)}</text>`};

  // cuisines ring
  let k=0;for(const id of ids){const n=items.filter(x=>x.id===id).length;if(!n)continue;const c=CUIS.find(x=>x[0]===id);const a0=A(k),a1=A(k+n);o+=`<path d="${arc(a0,a1,R1||R0,R2)}" fill="${GCOL[c[4]][0]}" stroke="#fff" stroke-width="2" data-cu="${id}" class="cu"><title>${esc(trUI(c[1]))}</title></path>`;

const MEALS=["Apéro","Frühstück","Brunch","Mittagessen","Abendessen","Snack","Dessert","Getränk"];
const DIETS=["vegetarisch","vegan","glutenfrei","laktosefrei","Fleisch","Fisch"];
function blank(){return{id:"",title:"",subtitle:"",collection:"",section:"",mealTypes:[],dishTypes:[],diet:[],mainIngredients:[],servings:"",time:{prep:null,total:null},nutrition:{per:"Portion",kcal:null,protein:null,fat:null,carbs:null,estimated:false},ingredients:[],steps:[],tips:"",source:"",sourceUrl:"",photo:null}}
function ingToText(ings){return (ings||[]).map(g=>(g.group?"## "+g.group+"\n":"")+(g.items||[]).map(i=>[fmtQty(i),i.name].filter(Boolean).join(" ")+(i.note?", "+i.note:"")).join("\n")).join("\n")}
const UNITS=["g","kg","mg","ml","cl","dl","l","EL","TL","Msp.","Prise","Prisen","Bund","Zweig","Zweige","Zweiglein","Stück","Scheibe","Scheiben","Tranchen","Dose","Dosen","Becher","Pck.","Packung","Würfel","Zehe","Zehen","Knoblauchzehe","Tasse","Tassen","Handvoll","Glas","Blatt","Blätter","Rolle","wenig","etwas"];
function parseIng(text){
  const groups=[];let cur={group:"",items:[]};
  for(let line of text.split("\n")){line=line.trim();if(!line)continue;
    if(line.startsWith("##")){if(cur.items.length||cur.group)groups.push(cur);cur={group:line.replace(/^#+\s*/,""),items:[]};continue}
    line=line.replace(/^[-*•·]\s*/,"").replace(/,\s*$/,"");
    let qty="",unit="",rest=line;
    const glued=rest.match(/^((?:ca\.\s*)?\d+(?:[.,]\d+)?)(g|kg|mg|ml|cl|dl|l|EL|TL)\b\.?\s*(.*)$/);
    const m=glued?null:rest.match(/^((?:ca\.\s*)?[\d½¼¾⅓⅔.,\/\-–]+(?:\s*[½¼¾])?)\s+(.*)$/);
    if(glued){qty=glued[1];unit=glued[2];rest=glued[3]}
    else if(m){qty=m[1];rest=m[2]}
    const u=unit?null:UNITS.find(u=>rest===u||rest.startsWith(u+" ")||rest.startsWith(u+","));
    if(u&&(qty||u==="wenig"||u==="etwas")){const after=rest.slice(u.length).replace(/^,\s*/,"").trim();
      if(after&&!rest.startsWith(u+",")){unit=u;rest=after}else if(!after){/* «1 Knoblauchzehe»: Wort bleibt Name */}}
    let note="";const sp=rest.match(/^(Salz,?\s*(?:und\s*)?Pfeffer)(?:,\s*)?(.*)$/i);
    if(sp){rest=sp[1];note=sp[2]}else{const ci=rest.indexOf(", ");if(ci>0){note=rest.slice(ci+2);rest=rest.slice(0,ci)}}
    rest=rest.replace(/,$/,"");note=note.replace(/,$/,"");
    cur.items.push({qty,unit,name:rest,note});
  }
  if(cur.items.length||cur.group)groups.push(cur);
  return groups;
}

async function uploadImage(file,max=1400){
  if(!assets)throw {message:"Fotos hochladen ist nur möglich, wenn die App mit GitHub verbunden ist."};
  let blob=file;
  if(/\.hei[cf]$/i.test(file.name||"")||/heic|heif/.test(file.type)){try{const t=await shrink(file,max);if(t&&t!==file)blob=t;else throw 0}catch(e){
    if(!window.heic2any)await loadScript("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js");const c=await heic2any({blob:file,toType:"image/jpeg",quality:.9});blob=await shrink(Array.isArray(c)?c[0]:c,max)}}
  else blob=await shrink(file,max);
  const r=await assets.upload(blob,{type:"image/jpeg"});return r.id}

function openCrop(m,done){
  const c={scale:1,offsetX:0,offsetY:0,...(m.crop||{})};const w=document.createElement("div");w.className="pmodal crop-modal";
  w.innerHTML=`<div class="scrim"></div><div class="pbox cropbox"><button type="button" class="pclose" aria-label="Schliessen">✕</button><h2>Ausschnitt anpassen</h2>
    <div class="cropframe">${mediaImg(m)}</div><div class="cropzoom"><span>Zoom</span><input type="range" min="1" max="3" step=".02" value="${c.scale}"></div>
    <div class="peact"><button type="button" class="btn" id="cr-reset">Zurücksetzen</button><span class="sp"></span><button type="button" class="btn primary" id="cr-ok">Übernehmen</button></div>
    <p class="ro">Ziehen zum Verschieben, Regler zum Zoomen. Dieser Ausschnitt erscheint im Feed.</p></div>`;
  const img=w.querySelector(".cropframe img"),fr=w.querySelector(".cropframe"),sl=w.querySelector("input[type=range]");
  const clamp=(o,s)=>{const mx=(s-1)*50;return mx<=0?0:Math.max(-mx,Math.min(mx,o))};const upd=()=>{if(img)img.style.cssText=cropCss(c)};upd();
  sl.oninput=()=>{c.scale=+sl.value;c.offsetX=clamp(c.offsetX,c.scale);c.offsetY=clamp(c.offsetY,c.scale);upd()};
  let dr=null;fr.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,ox:c.offsetX,oy:c.offsetY};fr.setPointerCapture(e.pointerId)};
  fr.onpointermove=e=>{if(!dr)return;const r=fr.getBoundingClientRect();c.offsetX=clamp(dr.ox+(e.clientX-dr.x)/r.width*100/c.scale,c.scale);c.offsetY=clamp(dr.oy+(e.clientY-dr.y)/r.height*100/c.scale,c.scale);upd()};
  fr.onpointerup=fr.onpointercancel=()=>dr=null;
  const close=()=>w.remove();w.querySelector(".scrim").onclick=close;w.querySelector(".pclose").onclick=close;
  w.querySelector("#cr-reset").onclick=()=>{c.scale=1;c.offsetX=0;c.offsetY=0;sl.value=1;upd()};
  w.querySelector("#cr-ok").onclick=()=>{m.crop={...c};close();done&&done()};
  document.body.appendChild(w)}

// generisches Ziehen per Zeiger (Maus und Touch): kurzes Tippen = onTap
function dragItem(el,targetSel,onDrop,onTap){
  let st=null;
  el.addEventListener("pointerdown",e=>{if(e.button>0||e.target.closest("button:not(.igtile),input,label"))return;st={x:e.clientX,y:e.clientY,moved:false,over:null,t:setTimeout(()=>{if(st&&!st.moved){st.moved=true;el.classList.add("dragging")}},280)};el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)>10){if(e.pointerType==="touch"&&!el.classList.contains("dragging")){clearTimeout(st.t);st=null;return}st.moved=true;el.classList.add("dragging")}
    if(st.moved){e.preventDefault();el.style.transform=`translate(${dx}px,${dy}px)`;el.style.pointerEvents="none";const u=document.elementFromPoint(e.clientX,e.clientY);el.style.pointerEvents="";const o=u&&u.closest(targetSel);document.querySelectorAll(".drop-on").forEach(x=>x.classList.remove("drop-on"));if(o&&o!==el){o.classList.add("drop-on");st.over=o}else st.over=null}});
  const end=()=>{if(!st)return;clearTimeout(st.t);const s=st;st=null;el.classList.remove("dragging");el.style.transform="";document.querySelectorAll(".drop-on").forEach(x=>x.classList.remove("drop-on"));if(s.moved&&s.over)onDrop(s.over);else if(!s.moved&&onTap)onTap()};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",()=>{if(st){clearTimeout(st.t);st=null;el.classList.remove("dragging");el.style.transform=""}})}

      cw.onpointermove=ev=>{pts.push(P(ev));draw()};cw.onpointerup=()=>{cw.onpointermove=null;cw.onpointerup=null;if(pts.length>1){b.strokes=b.strokes||[];b.strokes.push({c:bPen,w:+path.getAttribute("stroke-width"),d:path.getAttribute("d")});save()}else path.remove()}}}
  // Karten ziehen & ankleben
  const kids=id=>{const out=[];const st=[id];while(st.length){const c=st.pop();for(const o of b.items)if(o.glue===c&&!out.includes(o)){out.push(o);st.push(o.id)}}return out};
  pg.querySelectorAll("[data-drag]").forEach(h=>h.onpointerdown=e=>{if(!canWrite||e.target.closest("button")||e.pointerType==="pen"&&bDraw)return;e.preventDefault();e.stopPropagation();const it=b.items.find(i=>i.id===h.dataset.drag);if(!it)return;

    const els=group.map(g=>document.getElementById(g.id));els.forEach(el=>el.classList.add("drag"));
    h.onpointermove=ev=>{const dx=(ev.clientX-sx)/z,dy=(ev.clientY-sy)/z;start.forEach(({g,x,y},i)=>{g.x=Math.max(0,Math.round(x+dx));g.y=Math.max(0,Math.round(y+dy));els[i].style.left=g.x+"px";els[i].style.top=g.y+"px"})};
    h.onpointerup=()=>{h.onpointermove=null;h.onpointerup=null;els.forEach(el=>el.classList.remove("drag"));
      const me=document.getElementById(it.id);const R=el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top),w:el.offsetWidth,h:el.offsetHeight});const a=R(me);const ex=new Set(group.map(g=>g.id));let best=null;
      for(const o of b.items){if(ex.has(o.id))continue;const el=document.getElementById(o.id);if(!el)continue;const r=R(el);const S=28;
        const cand=[{x:r.x+r.w+10,y:r.y},{x:r.x,y:r.y+r.h+10},{x:r.x-a.w-10,y:r.y}].map(c=>({...c,d:Math.hypot(a.x-c.x,a.y-c.y)}));
        for(const c of cand){if(!(c.d<S*2&&(!best||c.d<best.d)))continue;const hit=b.items.some(q=>{if(ex.has(q.id)||q.id===o.id)return false;const qe=document.getElementById(q.id);if(!qe)return false;const qr=R(qe);return c.x<qr.x+qr.w&&c.x+a.w>qr.x&&c.y<qr.y+qr.h&&c.y+a.h>qr.y});if(!hit)best={...c,o}}}
      if(best){const dx=best.x-it.x,dy=best.y-it.y;for(const g of group){g.x+=dx;g.y+=dy}it.glue=best.o.id}
      else if(it.glue){const p=b.items.find(o=>o.id===it.glue);const pe=p&&document.getElementById(p.id);if(pe){const r=R(pe);const near=Math.abs(a.x-(r.x+r.w+10))<60||Math.abs(a.y-(r.y+r.h+10))<60;if(!near)delete it.glue}}
      save();rer()}});
  $("#bd-q")&&($("#bd-q").oninput=e=>{const s=norm(e.target.value.trim());const box=$("#bd-res");if(s.length<2){box.innerHTML="";return}
    const hits=recipes.filter(r=>!(b.recipes||[]).includes(r.id)&&s.split(/\s+/).every(x=>r._hay.includes(x))).sort((x,y)=>(!x.photo-!y.photo)||(norm(y.title).includes(s)-norm(x.title).includes(s))).slice(0,8);

    box.querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{b.recipes=[...(b.recipes||[]),x.dataset.add];const p=place();b.items.push({id:uid("it"),kind:"rec",rid:x.dataset.add,x:p.x,y:p.y});save();rer()})});
  $("#bd-post").onclick=()=>openPost(null,{recipes:[...(b.recipes||[])],caption:b.title||""});
  const del=$("#bd-del");if(del)del.onclick=async()=>{if(!bDel){bDel=true;renderPage();setTimeout(()=>{if(bDel){bDel=false;if(state.page==="board")renderPage()}},4000);return}bDel=false;try{await delDoc(b.id);boards=boards.filter(x=>x.id!==b.id);toast("Board gelöscht");showPage("mix")}catch(x){toast(errText(x))}};
  const mk=$("#bd-make");if(mk)mk.onclick=async()=>{const rs=(b.recipes||[]).map(id=>recipes.find(r=>r.id===id)).filter(Boolean);const ing=[],steps=[];
    const cut=(t,m)=>{if(!m)return null;if(!m.r||!m.r.length)return m.c?t:null;const parts=[...m.r].sort((x,y)=>x[0]-y[0]).map(([a,e])=>t.slice(a,e).trim()).filter(Boolean);return parts.length?parts.join(" … "):t};
    for(const r of rs){const m=(b.marks||{})[r.id]||{};(r.ingredients||[]).forEach((g,gi)=>(g.items||[]).forEach((i,ii)=>{const k=`i${gi}.${ii}`;const t=[fmtQty(i),i.name].filter(Boolean).join(" ")+(i.note?", "+i.note:"");const x=cut(t,m[k]);if(x)ing.push(x+(m[k].c?" ("+m[k].c+")":""))}));(r.steps||[]).forEach((s,si)=>{const x=cut(s,m["s"+si]);if(x)steps.push(x+(m["s"+si].c?" – "+m["s"+si].c:""))})}

    const pics=b.items.filter(i=>i.kind==="img").map(i=>i.photo);
    const d={...blank(),title:b.title||"Neues Rezept",ingredients:parseIng(ing.join("\n")),steps,tips:notes,source:"Mix aus: "+rs.map(r=>r.title).join(", "),own:true,collection:"Meine Rezepte",mixBoard:b.id,photo:pics[0]||"",photos:pics.slice(1),createdAt:Date.now()};
    d.mealTypes=[...new Set(rs.flatMap(r=>r.mealTypes||[]))];d.diet=rs.length&&rs.every(r=>(r.diet||[]).includes("vegan"))?["vegan"]:rs.length&&rs.every(r=>(r.diet||[]).some(x=>x==="vegan"||x==="vegetarisch"))?["vegetarisch"]:[];
    let id=slug(d.title);if(recipes.some(x=>x.id===id))id+="-"+Math.random().toString(36).slice(2,6);
    delete d.id;bFull=false;document.body.style.overflow="";try{await saveDoc(id,d)}catch(x){toast(errText(x));return}toast("In «Meine Rezepte» gespeichert");openRecipe(id)}}
function addToBoardChooser(rid){
  const w=document.createElement("div");w.className="pmodal";const r=recipes.find(x=>x.id===rid);
  w.innerHTML=`<div class="scrim"></div><div class="pbox"><button type="button" class="pclose" aria-label="Schliessen">✕</button><h2>Zu Mix-Board</h2><p class="psub2">«${esc(r?r.title:"")}»</p>

(async()=>{
